server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: ai-meeting-admin
  config:
    # application-local.yaml 存放本地开发凭据（真实密钥/数据库密码），已加入 .gitignore，不得提交
    # 依次尝试多个候选位置，兼容 IDE 从 admin / 项目根 / workspace 三种工作目录启动。
    # 全部为 optional，找不到即跳过；只有实际存在的那个会被加载。
    # 本地凭据（真实密钥/数据库密码）必须在其中一处命中，否则会回退到默认 6379/3306 且无 LLM key。
    import: optional:classpath:interview-followup-rule.yaml,optional:file:./application-local.yaml,optional:file:../application-local.yaml,optional:file:./admin/application-local.yaml,optional:file:./backend/admin/application-local.yaml
  profiles:
    include: satoken,sse
  servlet:
    multipart:
      location: ${AI_MEETING_MULTIPART_TEMP_DIR:${ai-meeting.storage.upload-temp-dir}}
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mainshi_agent}?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=${APP_TIMEZONE:Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms
      timeout: 10000ms
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: redis-session-task-
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
        thread-name-prefix: redis-session-async-
  ai:
    # 该段只用于满足 spring-ai-starter-model-openai 的自动装配前置条件；
    # 业务调用统一走 ai-meeting.llm（见下方），不读取这里。
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:sk-xxxxxxxxxxxxx}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.7}
      embedding:
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

management:
  endpoints:
    web:
      exposure:
        # prometheus 供外部抓取；health 供容器探针。其余端点仍保持关闭。
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    distribution:
      # 模型调用延迟：默认只导出 count/sum/max，没有分桶就算不出 histogram_quantile。
      # ai.call.latency.ms 是 AiCallGuardService 里 timer 的点分形式（指标名为 ai_call_latency_ms）。
      percentiles-histogram:
        ai.call.latency.ms: true
      # 同时保留客户端分位数，便于单实例直接看 P50/P95/P99，不依赖 bucket 聚合。
      percentiles:
        ai.call.latency.ms: 0.5, 0.95, 0.99
      # 默认分桶上限是 30s，覆盖不到出题阶段 60s 的超时预算，
      # 会让长尾全部堆进 +Inf 桶、P99 失真。这里按最长超时留一倍余量。
      minimum-expected-value:
        ai.call.latency.ms: 100ms
      maximum-expected-value:
        ai.call.latency.ms: 90s

logging:
  file:
    path: ${AI_MEETING_LOG_DIR:${ai-meeting.storage.log-dir}}

collection:
  vector:
    similarity-threshold: 0.9

ai-meeting:
  storage:
    base-dir: ${AI_MEETING_STORAGE_BASE_DIR:${user.home}/.ai-meeting}
    upload-temp-dir: ${AI_MEETING_MULTIPART_TEMP_DIR:${ai-meeting.storage.base-dir}/temp/upload}
    log-dir: ${AI_MEETING_LOG_DIR:${ai-meeting.storage.base-dir}/logs}
  thread-pool:
    general:
      core-pool-size: 50
      max-pool-size: 200
      queue-capacity: 1000
      keep-alive-seconds: 300
      thread-name-prefix: ai-meeting-async-
    ai-io:
      core-pool-size: 24
      max-pool-size: 64
      queue-capacity: 400
      keep-alive-seconds: 120
      thread-name-prefix: ai-meeting-ai-io-
    cpu:
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 256
      keep-alive-seconds: 60
      thread-name-prefix: ai-meeting-cpu-
    query:
      core-pool-size: 16
      max-pool-size: 48
      queue-capacity: 600
      keep-alive-seconds: 120
      thread-name-prefix: ai-meeting-query-
    scheduled-pool-size: 8
    scheduled-thread-name-prefix: ai-meeting-schedule-
  llm:
    # 直连大模型（OpenAI Chat Completions 协议）。切换 Qwen 只需改这三项：
    #   provider: qwen
    #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   model: qwen-plus
    provider: ${LLM_PROVIDER:deepseek}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:4096}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}
    scenes:
      interview-question-extraction:
        temperature: 0.2
        max-tokens: 6000
        timeout-seconds: 180
      interview-answer-evaluation:
        temperature: 0.1
        max-tokens: 1024
      interview-follow-up:
        temperature: 0.5
        max-tokens: 512
  # 视觉模型：图片简历 / 扫描版 PDF 的识别。走 OpenAI 兼容多模态协议。
  # 密钥通过 VISION_API_KEY 注入，留空时应用照常启动，仅视觉功能不可用。
  vision:
    # 千问 OpenAI 兼容接口。旧的 cn-beijing.maas.qianwenapi.com 域名目前无法解析；
    # 如使用其他区域或网关，通过 VISION_BASE_URL 覆盖。
    base-url: ${VISION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${VISION_MODEL:qwen3.8-omni-flash}
    api-key: ${VISION_API_KEY:}
    temperature: ${VISION_TEMPERATURE:0.1}
    max-tokens: ${VISION_MAX_TOKENS:4096}
    timeout-seconds: ${VISION_TIMEOUT_SECONDS:120}
    max-image-pages: ${VISION_MAX_IMAGE_PAGES:6}
    render-dpi: ${VISION_RENDER_DPI:150}
  flow-limit:
    enable: true
    time-window-seconds: 1
    max-access-count: 20
    requested-tokens: 1
    interview-answer-time-window-seconds: 1
    interview-answer-max-access-count: 8
    interview-heavy-time-window-seconds: 1
    interview-heavy-max-access-count: 2
    interview-read-time-window-seconds: 1
    interview-read-max-access-count: 15
    interview-ai-call-time-window-seconds: 1
    interview-ai-call-max-access-count: 6
  ai-guard:
    enable: true
    circuit-sliding-window-size: 50
    circuit-failure-rate-threshold: 50
    circuit-permitted-calls-in-half-open-state: 10
    circuit-open-state-wait-millis: 30000
    executor-threads: 32
    stages:
      interview-evaluation:
        timeout-millis: 20000
        max-concurrent-calls: 30
        retry-count: 1
        retry-wait-millis: 100
      interview-followup:
        timeout-millis: 20000
        max-concurrent-calls: 20
        retry-count: 1
        retry-wait-millis: 100
      interview-extraction:
        # 单次出题调用（含一次修复）的最坏耗时 = 2 × timeout + 解析。
        # 90s 对应 20 题更大的输出预算；调大这里必须同步调大重操作锁租期。
        timeout-millis: ${INTERVIEW_EXTRACTION_TIMEOUT_MILLIS:90000}
        max-concurrent-calls: 8
        retry-count: 0
        retry-wait-millis: 0
  # P3 起 single-flight / 模型结果缓存已退役：幂等与互斥由 MySQL 唯一约束、
  # attemptToken 与 version 乐观锁保障，不再需要这段协调配置。
  # P4 起 Mongo 快照与 Redis 会话同步一并退役，redis-session / turn-repair 段同步移除。
  interview:
    extraction:
      # 未在请求里指定 questionCount 时的默认题量；请求参数优先于这里。
      question-count: ${INTERVIEW_QUESTION_COUNT:10}
      # 允许的题量区间：下限保证一场面试的完整性，上限受单次输出 token 与重操作锁租期约束。
      # 上调上限前先确认 max-tokens-ceiling 仍能容下题目对象（每题约 400 tokens）。
      question-count-min: ${INTERVIEW_QUESTION_COUNT_MIN:5}
      question-count-max: ${INTERVIEW_QUESTION_COUNT_MAX:20}
      # 输出预算按题量线性放大：meta 预留 2000 + 每题 400，再由 floor/ceiling 夹住。
      # 10 题约 6000，20 题会顶到 ceiling——再大就需要精简字段或分批生成，而不是继续加大上限。
      max-tokens-per-question: ${INTERVIEW_EXTRACTION_TOKENS_PER_QUESTION:400}
      max-tokens-floor: ${INTERVIEW_EXTRACTION_TOKENS_FLOOR:4096}
      max-tokens-ceiling: ${INTERVIEW_EXTRACTION_TOKENS_CEILING:8192}
    answer-guard:
      # 答题锁：固定租期，不启用看门狗。锁只串行化入口，执行权由提交行租约表达。
      # 线程卡死时锁必须能自然过期，否则接管的请求永远进不了临界区。
      lock-expire-seconds: 120
      lock-watchdog-enabled: false
      lock-wait-millis: 0
      # 重型 AI 锁（材料解析/出题）：覆盖 "材料 OCR 120s + 首次出题 90s + 修复 90s" = 300s。
      # 两次 OCR 叠加的极端情况仍可能超出，但此时晚到的写入会被会话 version CAS 拒绝，
      # 锁过期只意味着可能重复消耗一次模型调用，不会覆盖已有题库。调大出题超时前先核对这里。
      heavy-lock-expire-seconds: 300
      # 执行权租约：每 20s 刷一次心跳，60s（3 倍）未刷到视为失联，180s 为单次尝试硬上限。
      heartbeat-interval-seconds: 20
      heartbeat-lease-seconds: 60
      attempt-deadline-seconds: 180
      # 迁移前产生的旧行（两列为 NULL）仍按 update_time 判定，兼容历史数据。
      legacy-processing-timeout-seconds: 300
