apiVersion: 1

providers:
  - name: ai-meeting
    orgId: 1
    folder: AI Meeting
    type: file
    disableDeletion: false
    # 改完 dashboard JSON 后最多 10s 自动重新加载，不需要重启 Grafana。
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
