name: backend-ci

on:
  push:
    branches:
      - main
      - master
      - develop
      - "codex/**"
    paths-ignore:
      - "backend/docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "backend/docs/**"
      - "**/*.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # ActuatorHealthEndpointTest 会启动 Spring 上下文，需要可达的 MySQL/Redis。
    # 这里只提供中间件，不导入业务 DDL：现有测试均为 mock 或健康检查，不查表。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: mainshi_agent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/admin/pom.xml

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      # clean verify 已包含 spotless 格式校验与全量单元测试，
      # 不再使用 -Dmaven.test.skip=true 跳过测试。
      - name: Verify repository
        run: ./mvnw -B -ntp clean verify
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: mainshi_agent
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: 123456
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
